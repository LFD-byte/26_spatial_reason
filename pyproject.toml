[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spatial-reason"
version = "0.1.0"
description = "Spatial foundation-model embeddings + LLM reasoning for niche identification"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "anndata",
    "scanpy",
    "pyyaml",
]

[project.optional-dependencies]
llm = ["torch", "transformers", "peft", "accelerate", "datasets"]
encoders = ["novae"]
dev = ["pytest", "ruff", "jupyterlab"]

[tool.hatch.build.targets.wheel]
packages = ["src/spatial_reason"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
